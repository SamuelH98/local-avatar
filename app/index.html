<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Local Companion</title>
<style>
  :root { --bg:#0e1115; --panel:#151a20; --line:#252c35; --text:#e7ebef; --muted:#8794a3; --accent:#8ab4ff; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:#000; color:var(--text); font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif; }

  /* The face fills the screen */
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  #stage::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, #0007 100%), linear-gradient(transparent 68%, #000b); }
  /* Blurred copy of the photo fills the whole screen; the sharp video sits on top, sized by fitFace() in app.js */
  #bg { position:absolute; inset:-8%; background:#000 center/cover; filter:blur(36px) brightness(.8); transition:filter .5s; display:none; }
  #bg.on { display:block; }
  #dv { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:fill; display:none; background:transparent; transition:filter .5s;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    -webkit-mask-composite:source-in; mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent); mask-composite:intersect; }
  #dv.on { display:block; }
  body.calling #dv { filter:brightness(.55); }
  body.calling #bg { filter:blur(36px) brightness(.45); }
  #drop { position:relative; z-index:2; max-width:380px; padding:48px 36px; text-align:center; cursor:pointer;
    color:var(--muted); background:var(--bg); border:1.5px dashed var(--line); border-radius:20px; }
  #drop b { display:block; margin-bottom:6px; color:var(--text); font-size:18px; }
  #drop.over { border-color:var(--accent); }

  /* Status pill, small camera preview, live captions */
  #state { position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:5;
    padding:5px 14px; font-size:13px; color:#fff; background:#0008; backdrop-filter:blur(8px); border-radius:99px; white-space:nowrap; }
  #cam { position:fixed; right:16px; top:calc(60px + env(safe-area-inset-top,0px)); width:120px; z-index:5;
    transform:scaleX(-1); border:1px solid #fff3; border-radius:12px; }
  #cap { position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:5;
    width:min(760px,90vw); text-align:center; font-size:clamp(16px,2.2vw,22px); color:#fff; text-shadow:0 2px 14px #000;
    opacity:0; transition:opacity .4s; pointer-events:none; }
  #cap.you { color:#cfd8e6; font-style:italic; }

  /* Buttons */
  input, select, button { font:inherit; color:var(--text); background:#1d242c; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  input { flex:1; min-width:0; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#0e1115; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #bar { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    display:flex; gap:16px; align-items:center; z-index:10; }
  .rb { width:60px; height:60px; padding:0; display:flex; align-items:center; justify-content:center; border:0; border-radius:50%;
    color:#fff; background:#ffffff2b; backdrop-filter:blur(10px); }
  .rb svg { width:26px; height:26px; fill:currentColor; }
  .rb.off { background:#f5a524; color:#1a1200; }                 /* muted: amber (hang-up is red, call is green) */
  .rb .slash { display:none; }
  .rb.off .slash { display:block; }                                /* muted: a line through the mic */
  .rb:disabled { opacity:.4; cursor:default; }
  .go, .end { width:72px; height:72px; }
  .go { background:#2ecc71; }
  .end { background:#e5484d; }
  .end svg { transform:rotate(135deg); }
  #hang, #mic { display:none; }
  body.incall #hang, body.incall #mic, body.calling #hang { display:flex; }
  body.incall #call, body.calling #call { display:none; }

  /* When the side panel is open, the face re-centres in the space that is left (video is object-fit: cover, so it still fills it) */
  :root { --side:min(380px,100vw); }
  #stage { transition:right .25s; }
  body.side #stage { right:var(--side); }
  #state, #cap, #bar { transition:left .25s, right .25s; }
  body.side #state, body.side #cap, body.side #bar { left:calc((100vw - var(--side)) / 2); }
  body.side #cam { right:calc(16px + var(--side)); }

  /* Side panel: conversation + settings */
  aside { position:fixed; top:0; right:0; bottom:0; z-index:20; width:min(380px,100vw); min-height:0; display:flex; flex-direction:column;
    background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s; }
  body.side aside { transform:none; }
  #log { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  #log div { max-width:90%; padding:8px 12px; border-radius:14px; background:#1d242c; }
  #log .you { align-self:flex-end; background:#27364f; }
  #log .sys { align-self:center; background:none; color:var(--muted); font-size:13px; text-align:center; }
  form { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--line); }
  details { padding:10px 14px 14px; border-top:1px solid var(--line); }
  summary { cursor:pointer; color:var(--muted); }
  label { display:grid; grid-template-columns:90px 1fr; align-items:center; gap:8px; margin-top:8px; color:var(--muted); font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
</style>
</head>
<body>

<section id="stage">
  <div id="drop" tabindex="0"><b>Add a face</b>Drop a front-facing portrait here, or click to choose one. Mouth closed, face large and well lit works best.</div>
  <div id="bg"></div>
  <video id="dv" playsinline></video>
</section>
<video id="cam" muted playsinline hidden></video>
<div id="state">Starting…</div>
<div id="cap"></div>

<div id="bar">
  <button type="button" class="rb" id="mic" title="Mute / unmute">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/><path class="slash" d="M4.3 3 3 4.3l17 17 1.3-1.3z" stroke="#f5a524" stroke-width="1.6"/></svg>
  </button>
  <button type="button" class="rb go" id="call" title="Call" disabled>
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>
  </button>
  <button type="button" class="rb end" id="hang" title="Hang up">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>
  </button>
  <button type="button" class="rb" id="chat" title="Chat &amp; settings">
    <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/></svg>
  </button>
</div>

<aside>
  <div id="log"></div>
  <form id="f"><input id="in" placeholder="Type instead…" autocomplete="off"><button>Send</button></form>
  <details open>
    <summary>Settings</summary>
    <label>Chat model<select id="m"></select></label>
    <label>Vision model<select id="vm"></select></label>
    <label>Voice<select id="vo"></select></label>
    <label>Zoom<input type="range" id="zoom" min="35" max="100" step="1" value="65"></label>
    <label>Interrupt<select id="bi"><option value="1">On (best with headphones)</option><option value="0">Off</option></select></label>
    <div class="row">
      <button type="button" id="camb">Camera: off</button>
      <button type="button" id="selfie" hidden>Use camera frame as face</button>
      <button type="button" id="look" hidden>What do you see?</button>
      <button type="button" id="photo">Change photo</button>
    </div>
  </details>
</aside>
<input type="file" id="file" accept="image/*" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
